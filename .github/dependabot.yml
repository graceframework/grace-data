version: 2
updates:
- package-ecosystem: gradle
  directory: "/"
  schedule:
    interval: daily
  open-pull-requests-limit: 10
  target-branch: 2024.1.x
  labels:
    - "dependency upgrade"
  ignore:
    - dependency-name: "*"      
      update-types: ["version-update:semver-patch", "version-update:semver-minor"] 
